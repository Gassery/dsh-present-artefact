# present_artefact: one review card for any produced artefact.
#
# The row mounts a Host + Client package:
#   - Host (index.js): registers the global `present_artefact` tool, holds the
#     pending review, and answers it over an authenticated `/api` route.
#   - Client (client.js): renders the review card at the tool call position and
#     the full inline artefact in the right sidebar.
#
# Inline content travels in the tool call arguments, so nothing is written to
# disk and the review works under a read-only sandbox. File artefacts are only
# read, and open through the shipped `dsh-resource://file/…` preview.
- insert:
    - id: tool-present-artefact
      name: 'dsh-present-artefact'
